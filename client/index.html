<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dodgeball LAN</title><link rel="stylesheet" href="styles.css">
</head>
<body><main class="app-shell">
  <header class="topbar"><h1>Dodgeball LAN</h1><p id="connection-status" class="status">Disconnected</p></header>
  <section id="screen-lobby" class="screen card"><h2>Join a game</h2>
    <label>Player name <input id="player-name" maxlength="24" value="Chrome player" autocomplete="nickname"></label>
    <div class="row"><button id="create-lobby">Create lobby</button><span class="or">or</span><input id="join-code" maxlength="6" placeholder="JOIN CODE" aria-label="Join code"><button id="join-lobby">Join</button></div>
    <p id="lobby-error" class="error" role="alert"></p>
  </section>
  <section id="screen-setup" class="screen card hidden"><div class="setup-heading"><div><h2>Lobby <code id="display-join-code">------</code></h2><p>Share this code with the other players.</p></div><button id="leave-setup" class="secondary">Leave</button></div>
    <ul id="roster" class="roster"></ul><div id="host-controls" class="controls hidden"><label>Rounds <select id="round-count"><option>1</option><option selected>3</option><option>5</option><option>7</option></select></label><label>Turn seconds <select id="turn-seconds"><option>30</option><option>45</option><option selected>60</option><option>120</option></select></label><button id="apply-config">Apply setup</button><button id="start-match">Start match</button></div>
    <button id="ready-button" class="ready">Ready</button><p id="setup-error" class="error" role="alert"></p>
  </section>
  <section id="screen-game" class="screen game-screen hidden"><div class="hud"><div id="player-hud" class="player-hud"></div><div id="turn-hud" class="turn-hud">--</div><div id="round-hud" class="round-hud">Round --</div></div><div class="canvas-wrap"><canvas id="game-canvas" width="1280" height="720" aria-label="Dodgeball game stage"></canvas></div><p class="controls-hint">Your turn: hold A/D or ←/→ to move. Press E to attack.</p><p id="game-error" class="error" role="alert"></p></section>
  <section id="screen-result" class="screen card result-screen hidden"><h2 id="result-title">Game over</h2><p id="result-message"></p><div id="result-scores" class="result-scores"></div><button id="leave-result">Return to setup</button></section>
</main><script type="module" src="/client.js"></script></body></html>
